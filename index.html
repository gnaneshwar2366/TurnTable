<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Turntable</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap">
<style>
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
/* Layout concept: one portrait screen. Slim top bar, a stats line, a square plate that turns under your
   thumbs, and a control row with the two big turn buttons at the ends so both thumbs reach them.
   Colour is reserved for the four balls and their holes; plate, walls and chrome stay in a cool
   green-grey so the coloured pieces are what you see first. */
:root {
  --font-display: 'Fredoka', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
  --font-body: 'Nunito', ui-rounded, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --bg: #E6F0EC;
  --bg-glow: rgba(46, 160, 140, 0.16);
  --panel: #FFFFFF;
  --panel-2: #F1F6F4;
  --plate: #FBFDFC;
  --floor-a: #E9F1EE;
  --floor-b: #E1EBE7;
  --wall: #3A4A5E;
  --wall-top: #566982;
  --fg: #16262B;
  --muted: #587078;
  --line: #CFDDD8;
  --accent: #0F9D8A;
  --accent-ink: #FFFFFF;
  --gold: #FFB800;
  --b1: #FF6B4A; --b2: #2F8BFF; --b3: #FFB800; --b4: #14C27A;
  --shadow: rgba(18, 50, 58, 0.28);
  --scrim: rgba(10, 30, 36, 0.55);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B171B;
    --bg-glow: rgba(30, 190, 165, 0.14);
    --panel: #14262C;
    --panel-2: #1B3239;
    --plate: #17292F;
    --floor-a: #1F363D;
    --floor-b: #1A3037;
    --wall: #0C171B;
    --wall-top: #3B5662;
    --fg: #EAF6F3;
    --muted: #8FB0B6;
    --line: #27424A;
    --accent: #25D0B8;
    --accent-ink: #062622;
    --gold: #FFC933;
    --b1: #FF7A5C; --b2: #4C9DFF; --b3: #FFC933; --b4: #2EDC8E;
    --shadow: rgba(0, 0, 0, 0.55);
    --scrim: rgba(2, 8, 10, 0.72);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B171B;
  --bg-glow: rgba(30, 190, 165, 0.14);
  --panel: #14262C;
  --panel-2: #1B3239;
  --plate: #17292F;
  --floor-a: #1F363D;
  --floor-b: #1A3037;
  --wall: #0C171B;
  --wall-top: #3B5662;
  --fg: #EAF6F3;
  --muted: #8FB0B6;
  --line: #27424A;
  --accent: #25D0B8;
  --accent-ink: #062622;
  --gold: #FFC933;
  --b1: #FF7A5C; --b2: #4C9DFF; --b3: #FFC933; --b4: #2EDC8E;
  --shadow: rgba(0, 0, 0, 0.55);
  --scrim: rgba(2, 8, 10, 0.72);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { height: 100%; }
body {
  height: 100%; margin: 0; overflow: hidden;
  background: radial-gradient(110% 55% at 50% 0%, var(--bg-glow), transparent 70%), var(--bg);
  color: var(--fg);
  font: 700 15px/1.35 var(--font-body);
  -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  touch-action: manipulation; overscroll-behavior: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

#app { height: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; min-height: 0; }

/* ---------- top ---------- */
.top { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 14px; border: 2px solid var(--line); background: var(--panel); padding: 0; }
.icon-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.title { text-align: center; line-height: 1.1; min-width: 0; }
.title .lv { font-family: var(--font-display); font-weight: 700; font-size: 26px; letter-spacing: 0.01em; }
.title .sub { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 800; }
.top-r { display: flex; gap: 8px; }

.stats { display: flex; justify-content: center; align-items: center; gap: 18px; min-height: 34px; }
.stat { display: flex; align-items: baseline; gap: 6px; font-weight: 900; }
.stat .lab { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.stat b { font-family: var(--font-display); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.stat b.bump { animation: bump 0.26s ease; }
.stars { display: inline-flex; gap: 3px; }
.stars svg { width: 24px; height: 24px; fill: var(--gold); stroke: none; transition: transform 0.25s, opacity 0.25s; }
.stars svg.off { fill: var(--line); transform: scale(0.82); }

/* ---------- stage + plate ---------- */
#stage { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; touch-action: none; }
.plate {
  position: relative; border-radius: 22px; background: var(--plate);
  width: var(--S, 320px); height: var(--S, 320px);
  box-shadow: 0 0 0 3px var(--line), 0 24px 40px -24px var(--shadow);
  will-change: transform; transform-origin: 50% 50%;
}
.grid { position: absolute; left: var(--pad, 10px); top: var(--pad, 10px); width: calc(var(--u, 40px) * var(--n, 6)); height: calc(var(--u, 40px) * var(--n, 6)); border-radius: 12px; overflow: hidden;
  background:
    conic-gradient(var(--floor-b) 25%, var(--floor-a) 0 50%, var(--floor-b) 0 75%, var(--floor-a) 0) 0 0 / calc(var(--u, 40px) * 2) calc(var(--u, 40px) * 2);
}
.cell { position: absolute; left: 0; top: 0; width: var(--u, 40px); height: var(--u, 40px); }
.wall {
  background: var(--wall); border-radius: calc(var(--u, 40px) * 0.2);
  box-shadow: inset 0 calc(var(--u, 40px) * 0.1) 0 var(--wall-top), inset 0 calc(var(--u, 40px) * -0.08) 0 rgba(0, 0, 0, 0.25);
  transform-origin: center;
}
.hole { display: grid; place-items: center; }
.hole .well {
  width: 82%; height: 82%; border-radius: 50%;
  background: radial-gradient(circle at 50% 42%, rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.82));
  box-shadow: 0 0 0 calc(var(--u, 40px) * 0.07) var(--hc), inset 0 2px 5px rgba(0, 0, 0, 0.6);
  position: relative; transition: box-shadow 0.25s, background 0.25s;
}
.hole.filled .well { background: radial-gradient(circle at 38% 32%, color-mix(in srgb, var(--hc) 60%, #fff), var(--hc) 60%); box-shadow: 0 0 0 calc(var(--u, 40px) * 0.07) var(--hc), 0 0 14px var(--hc); }
.hole .gl { position: absolute; inset: 0; }
.ball { position: absolute; left: 0; top: 0; width: var(--u, 40px); height: var(--u, 40px); will-change: transform; z-index: 3; }
.ball.gone { display: none; }
.ball .up { position: absolute; inset: 11%; border-radius: 50%; will-change: transform; }
.ball .sph {
  position: absolute; inset: 0; border-radius: 50%;
  background: radial-gradient(circle at 34% 28%, #fff 0 9%, color-mix(in srgb, var(--hc) 70%, #fff) 10% 28%, var(--hc) 62%, color-mix(in srgb, var(--hc) 70%, #000) 100%);
  box-shadow: 0 calc(var(--u, 40px) * 0.1) calc(var(--u, 40px) * 0.14) rgba(0, 0, 0, 0.35);
}
.gl { display: block; position: absolute; inset: 31%; background: rgba(255, 255, 255, 0.78); pointer-events: none; }
[data-c="1"] { --hc: var(--b1); } [data-c="2"] { --hc: var(--b2); } [data-c="3"] { --hc: var(--b3); } [data-c="4"] { --hc: var(--b4); }
.gl[data-g="1"] { clip-path: polygon(50% 8%, 96% 90%, 4% 90%); }
.gl[data-g="2"] { border-radius: 50%; }
.gl[data-g="3"] { border-radius: 14%; }
.gl[data-g="4"] { clip-path: polygon(50% 2%, 98% 50%, 50% 98%, 2% 50%); }
.hole .gl { background: var(--hc); opacity: 0.9; inset: 27%; }
.hole.filled .gl { background: rgba(255, 255, 255, 0.8); }
.plate.nope { animation: nope 0.3s; }
.gravity { height: 26px; pointer-events: none; color: var(--muted); opacity: 0.8; display: grid; justify-items: center; align-content: center; }
.gravity svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; animation: nudge 1.6s ease-in-out infinite; }

.hintline { text-align: center; height: 40px; overflow: hidden; width: 100%; font-size: 14.5px; color: var(--muted); display: grid; place-items: center; line-height: 1.3; }
.hintline .hl { display: block; max-width: 100%; }
.hintline b { color: var(--fg); }
.hintline.warn { color: var(--fg); }
.hintline .warnchip { display: inline-block; background: var(--gold); color: #2A1C00; border-radius: 999px; padding: 2px 11px; font-weight: 900; font-size: 13px; margin-right: 6px; }

/* ---------- controls ---------- */
.ctl { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding-bottom: 4px; }
.turn {
  width: 76px; height: 76px; border-radius: 26px; border: 0; padding: 0; display: grid; place-items: center;
  background: var(--accent); color: var(--accent-ink); box-shadow: 0 6px 0 rgba(0, 0, 0, 0.22);
}
.turn svg { width: 40px; height: 40px; stroke: currentColor; fill: none; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }
.turn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0, 0, 0, 0.22); }
.turn.pulse { animation: pulse 0.7s ease-in-out 3; }
.mid { display: flex; justify-content: center; gap: 10px; }
.mid .icon-btn { width: 50px; height: 50px; }
.mid .icon-btn:disabled { opacity: 0.4; cursor: default; }
.icon-btn.glow { animation: pulse 0.7s ease-in-out 3; }

/* ---------- screens ---------- */
.screen {
  position: fixed; inset: 0; z-index: 40; overflow: auto; display: grid; place-items: center;
  grid-template-columns: minmax(0, 1fr);
  background: radial-gradient(110% 55% at 50% 0%, var(--bg-glow), transparent 70%), var(--bg);
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.card { width: min(100%, 440px); min-width: 0; display: grid; gap: 14px; margin: auto; }
.logo { font-family: var(--font-display); font-weight: 700; font-size: clamp(52px, 18vw, 84px); line-height: 0.9; letter-spacing: 0.005em; }
.logo span { color: var(--accent); }
.tag { margin: 0; color: var(--muted); font-size: 16px; }
.spinner { width: 112px; height: 112px; border-radius: 26px; background: var(--plate); box-shadow: 0 0 0 3px var(--line), 0 18px 30px -20px var(--shadow); position: relative; animation: spin 7s cubic-bezier(0.6, 0, 0.3, 1) infinite; }
.spinner i { position: absolute; width: 22px; height: 22px; border-radius: 50%; background: var(--hc); box-shadow: 0 4px 6px rgba(0, 0, 0, 0.25), inset -3px -4px 0 rgba(0, 0, 0, 0.12); }
.spinner i:nth-child(1) { left: 14px; top: 14px; } .spinner i:nth-child(2) { right: 14px; top: 14px; }
.spinner i:nth-child(3) { left: 14px; bottom: 14px; } .spinner i:nth-child(4) { right: 14px; bottom: 14px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 18px; width: 100%;
  border-radius: 16px; border: 2px solid var(--line); background: var(--panel); font-weight: 900; font-size: 17px;
}
.btn small { display: block; font-size: 12.5px; color: var(--muted); font-weight: 800; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; box-shadow: 0 5px 0 rgba(0, 0, 0, 0.22); min-height: 60px; font-size: 21px; font-family: var(--font-display); letter-spacing: 0.02em; }
.btn.primary:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0, 0, 0, 0.22); }
.btn.split { justify-content: space-between; text-align: left; }
.btn .stack { display: grid; line-height: 1.15; }
.linkish { background: none; border: 0; color: var(--muted); font-weight: 900; text-decoration: underline; text-underline-offset: 3px; padding: 8px; justify-self: center; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.levels { display: grid; gap: 16px; width: min(100%, 480px); margin: 0 auto; align-content: start; }
.levels h2 { margin: 0; font-family: var(--font-display); font-size: 30px; font-weight: 700; }
.world { display: grid; gap: 8px; }
.world .wn { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 900; display: flex; justify-content: space-between; }
.tiles { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.tile { aspect-ratio: 1; border-radius: 14px; border: 2px solid var(--line); background: var(--panel); display: grid; place-items: center; align-content: center; gap: 1px; padding: 0; font-family: var(--font-display); font-weight: 700; font-size: 19px; position: relative; }
.tile .st { display: flex; gap: 1px; height: 9px; }
.tile .st svg { width: 9px; height: 9px; fill: var(--gold); }
.tile .st svg.off { fill: var(--line); }
.tile.cur { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.tile:disabled { opacity: 0.35; cursor: default; }
.lvhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

.modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: var(--scrim); padding: 16px; overflow: auto; }
.sheet { width: min(100%, 400px); max-height: 100%; overflow: auto; background: var(--panel); border-radius: 26px; padding: 22px; display: grid; gap: 14px; margin: auto; }
.sheet h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 32px; line-height: 1; }
.sheet .sub { margin: 0; color: var(--muted); }
.sheet ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; }
.sheet li { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 12px; align-items: start; }
.sheet li b { font-weight: 900; }
.ic { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: var(--panel-2); border: 2px solid var(--line); }
.ic svg { width: 22px; height: 22px; stroke: var(--accent); fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.center { text-align: center; justify-items: center; }
.bigstars { display: flex; gap: 8px; justify-content: center; }
.bigstars svg { width: 58px; height: 58px; fill: var(--gold); transform: scale(0); }
.bigstars svg.off { fill: var(--line); }
.bigstars svg.in { animation: starin 0.5s cubic-bezier(0.3, 1.5, 0.5, 1) forwards; animation-delay: var(--d, 0ms); }

#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }

@media (max-height: 660px) {
  .turn { width: 64px; height: 64px; border-radius: 22px; }
  .title .lv { font-size: 22px; }
  .stat b { font-size: 22px; }
  .stars svg { width: 20px; height: 20px; }
  .hintline { height: 34px; font-size: 13px; }
  #app { gap: 6px; }
}

@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.3); } 100% { transform: scale(1); } }
@keyframes nope { 0%, 100% { translate: 0 0; } 25% { translate: -5px 0; } 75% { translate: 5px 0; } }
@keyframes nudge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px); } }
@keyframes pulse { 0%, 100% { transform: scale(1); filter: none; } 50% { transform: scale(1.12); filter: brightness(1.2); } }
@keyframes starin { 0% { transform: scale(0) rotate(-40deg); } 100% { transform: scale(1) rotate(0); } }
@keyframes spin { 0%, 12% { transform: rotate(0); } 28%, 40% { transform: rotate(90deg); } 56%, 68% { transform: rotate(180deg); } 84%, 100% { transform: rotate(270deg); } }
@media (prefers-reduced-motion: reduce) {
  .gravity svg, .turn.pulse, .icon-btn.glow, .spinner, .stat b.bump { animation: none; }
}

/* tutorial */
.hintline.tut { height: 104px; align-content: center; }
.hintline.tut .hl { font-size: 14px; }
.hintline .tt { font-family: var(--font-display); font-size: 18px; color: var(--fg); }
.tutbtns { display: flex; gap: 8px; justify-content: center; margin-top: 6px; }
.tutbtns button { font: inherit; font-weight: 800; font-size: 12.5px; color: var(--muted); background: transparent; border: 1.5px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
.finger { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none; z-index: 5; }
.finger[hidden] { display: none; }
.finger .dot { position: absolute; left: -23px; top: -23px; width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,.88); border: 3px solid var(--b1, #14A3A0); box-shadow: 0 6px 18px rgba(0,0,0,.28); }
.finger .tail { position: absolute; top: -5px; height: 10px; width: 110px; border-radius: 6px; }
.finger.r .tail { right: 0; background: linear-gradient(90deg, transparent, var(--b1, #14A3A0)); }
.finger.l .tail { left: 0; background: linear-gradient(270deg, transparent, var(--b1, #14A3A0)); }
@media (max-height: 700px) { .hintline.tut { height: 92px; } .hintline .tt { font-size: 16px; } }

</style>
</head>
<body>
<div id="app">
  <header class="top">
    <button class="icon-btn" id="btnLevels" type="button" aria-label="Levels"></button>
    <div class="title"><div class="lv" id="lvTitle">Level 1</div><div class="sub" id="lvSub"></div></div>
    <div class="top-r">
      <button class="icon-btn" id="btnSound" type="button" aria-label="Sound and haptics"></button>
      <button class="icon-btn" id="btnHelp" type="button" aria-label="How to play"></button>
    </div>
  </header>

  <main id="stage">
    <div class="stats" aria-live="polite">
    <div class="stat"><span class="lab">Moves</span><b id="moves">0</b></div>
    <div class="stars" id="stars" aria-label="Star rating"></div>
    <div class="stat"><span class="lab">Par</span><b id="par">0</b></div>
    </div>

    <div class="plate" id="plate" aria-label="Game board"><div class="grid" id="grid"></div></div>
    <div class="gravity" aria-hidden="true"><svg viewBox="0 0 24 24"><line x1="12" y1="4" x2="12" y2="18"/><polyline points="6 13 12 19 18 13"/></svg></div>
    <div class="hintline" id="hintline" aria-live="polite"></div>
    <div class="finger" id="finger" hidden aria-hidden="true"><i class="tail"></i><i class="dot"></i></div>
  </main>

  <section class="ctl" aria-label="Controls">
    <button class="turn" id="btnL" type="button" aria-label="Turn board left"></button>
    <div class="mid">
      <button class="icon-btn" id="btnUndo" type="button" aria-label="Undo"></button>
      <button class="icon-btn" id="btnHint" type="button" aria-label="Hint"></button>
      <button class="icon-btn" id="btnRestart" type="button" aria-label="Restart level"></button>
    </div>
    <button class="turn" id="btnR" type="button" aria-label="Turn board right"></button>
  </section>
</div>

<canvas id="fx" aria-hidden="true"></canvas>

<div class="screen" id="home">
  <div class="card">
    <div class="spinner" aria-hidden="true"><i data-c="1" style="--hc:var(--b1)"></i><i data-c="2" style="--hc:var(--b2)"></i><i data-c="3" style="--hc:var(--b3)"></i><i data-c="4" style="--hc:var(--b4)"></i></div>
    <div>
      <div class="logo">TURN<br><span>TABLE</span></div>
      <p class="tag">Turn the board. Let the balls roll. Drop each one into its own hole.</p>
    </div>
    <button class="btn primary" id="btnPlay" type="button">Play</button>
    <button class="btn split" id="btnDaily" type="button"></button>
    <button class="btn split" id="btnLevelsHome" type="button"></button>
    <button class="linkish" id="btnHow" type="button">How to play</button>
  </div>
</div>

<div class="screen" id="levels" hidden>
  <div class="levels">
    <div class="lvhead"><h2>Levels</h2><button class="icon-btn" id="btnLevelsClose" type="button" aria-label="Close levels"></button></div>
    <div id="levelGrid" style="display:grid;gap:16px"></div>
  </div>
</div>

<div class="modal" id="how" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="howTitle">
    <h2 id="howTitle">How to play</h2>
    <ul id="howList"></ul>
    <button class="btn" id="btnTutor" type="button">Watch the tutorial</button>
    <button class="btn primary" id="btnHowClose" type="button">Got it</button>
  </div>
</div>

<div class="modal" id="win" hidden>
  <div class="sheet center" role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <h2 id="winTitle">Solved</h2>
    <div class="bigstars" id="winStars"></div>
    <p class="sub" id="winSub"></p>
    <button class="btn primary" id="btnNext" type="button">Next level</button>
    <div class="row2" id="winRow" style="width:100%">
      <button class="btn" id="btnReplay" type="button">Replay</button>
      <button class="btn" id="btnWinLevels" type="button">Levels</button>
    </div>
  </div>

<script>
/* Turntable engine: pure logic, no DOM. Works in browser and Node.

   The board is a square grid of floor and walls. Balls and holes have colours 1..4 (one ball and one hole
   per colour). The player turns the board a quarter turn clockwise or anticlockwise. After each turn every
   ball falls toward the new "down". A ball that rolls over the hole of its own colour drops in and is
   removed. A ball rolls over holes of other colours. Win when every ball is in its hole.

   Gravity is tracked in the board's own frame, so k is the number of clockwise quarter turns mod 4:
   k=0 down (south), k=1 east, k=2 north, k=3 west. */
(function (root) {
  'use strict';

  var DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]];   // S, E, N, W in board coordinates
  var DIR_NAMES = ['south', 'east', 'north', 'west'];

  function makeRng(seed) {
    var s = seed >>> 0;
    var f = function () {
      s = (s + 0x6D2B79F5) >>> 0;
      var t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    return f;
  }
  function hashStr(str) {
    var h = 2166136261;
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }

  /* ---------- level format ----------
     Rows joined by '|'. '#' wall, '.' floor, 'a'..'d' ball (colours 1..4) on floor, 'A'..'D' hole. */
  function parse(str) {
    var rows = str.split('|'), n = rows.length, walls = new Array(n * n).fill(false), holeAt = new Array(n * n).fill(0);
    var ballStart = {}, holes = {}, colors = [];
    for (var r = 0; r < n; r++) {
      if (rows[r].length !== n) throw new Error('level must be square: ' + str);
      for (var c = 0; c < n; c++) {
        var ch = rows[r][c], i = r * n + c;
        if (ch === '#') walls[i] = true;
        else if (ch >= 'a' && ch <= 'd') { var col = ch.charCodeAt(0) - 96; ballStart[col] = i; if (colors.indexOf(col) < 0) colors.push(col); }
        else if (ch >= 'A' && ch <= 'D') { var hc = ch.charCodeAt(0) - 64; holeAt[i] = hc; holes[hc] = i; }
      }
    }
    colors.sort();
    return { n: n, walls: walls, holeAt: holeAt, colors: colors, start: colors.map(function (c) { return ballStart[c]; }), holeOf: colors.map(function (c) { return holes[c]; }), str: str };
  }

  function stringify(n, walls, ballCells, holeCells, colors) {
    var out = [];
    for (var r = 0; r < n; r++) {
      var row = '';
      for (var c = 0; c < n; c++) {
        var i = r * n + c, ch = walls[i] ? '#' : '.';
        for (var k = 0; k < colors.length; k++) {
          if (ballCells[k] === i) ch = String.fromCharCode(96 + colors[k]);
          if (holeCells[k] === i) ch = String.fromCharCode(64 + colors[k]);
        }
        row += ch;
      }
      out.push(row);
    }
    return out.join('|');
  }

  /* ---------- physics ---------- */
  // Let every ball fall in direction k. Mutates and returns pos. If `trace` is an array, per-ball paths are recorded.
  function settle(L, pos, k, trace) {
    var d = DIRS[k], n = L.n, order = [], i, b;
    for (b = 0; b < pos.length; b++) if (pos[b] >= 0) order.push(b);
    order.sort(function (x, y) {
      var rx = (pos[x] / n) | 0, cx = pos[x] % n, ry = (pos[y] / n) | 0, cy = pos[y] % n;
      return (ry * d[0] + cy * d[1]) - (rx * d[0] + cx * d[1]);   // furthest along the fall direction first
    });
    for (i = 0; i < order.length; i++) {
      b = order[i];
      var r = (pos[b] / n) | 0, c = pos[b] % n, from = pos[b], captured = false;
      for (;;) {
        var nr = r + d[0], nc = c + d[1];
        if (nr < 0 || nc < 0 || nr >= n || nc >= n) break;
        var ni = nr * n + nc;
        if (L.walls[ni]) break;
        var blocked = false;
        for (var o = 0; o < pos.length; o++) if (o !== b && pos[o] === ni) { blocked = true; break; }
        if (blocked) break;
        r = nr; c = nc;
        if (L.holeAt[ni] === L.colors[b]) { captured = true; break; }
      }
      var to = r * n + c;
      if (trace) trace.push({ ball: b, from: from, to: to, captured: captured });
      pos[b] = captured ? -1 : to;
    }

  /* ---------------- HUD ---------------- */
  function renderStars(n) {
    var h = '';

    $('#stars').innerHTML = h;
  }
  function updateHUD(bump) {

    renderStars(starsFor(hist.length));
    $('#btnUndo').disabled = !hist.length || busy || won;
  }
  var COACH = { 0: 'Turn the board right. The ball rolls to the new bottom.', 1: 'A ball only drops into the hole of its own colour.', 2: 'Swipe left or right on the board, or use the big buttons.', 3: 'Stuck? Tap the lightbulb for a hint.' };
  function setHint(html, warn) {

  var tutPhase = 'intro';

  function checkStuck() {

  /* ---------------- turning ---------------- */
  async function doTurn(dir, auto) {

    await rotatePlate(a0, a1, 360);

  }

  async function undo() {

    var d = sol.path[0], btn = d > 0 ? $('#btnR') : $('#btnL');
    btn.classList.remove('pulse'); void btn.offsetWidth; btn.classList.add('pulse');
    hintShown = true; sfx.hint();
    setHint('Best finish: <b>' + sol.length + '</b> more turn' + (sol.length === 1 ? '' : 's') + '. Next: <b>turn ' + (d > 0 ? 'right' : 'left') + '</b>.');
  }

  /* ---------------- tutorial ---------------- */
  function swipeAnim(dir) {

    var cx = p.left + p.width / 2 - st.left, cy = p.top + p.height / 2 - st.top, span = Math.min(150, p.width * 0.42);
    var x0 = cx - dir * span, x1 = cx + dir * span, btn = dir > 0 ? $('#btnR') : $('#btnL');

    btn.classList.remove('pulse'); void btn.offsetWidth; btn.classList.add('pulse');
    function T(x, s) { return 'translate(' + x + 'px,' + cy + 'px) scale(' + s + ')'; }
    return f.animate([
      { transform: T(x0, 1.2), opacity: 0 }, { transform: T(x0, 1), opacity: 1, offset: 0.18 },
      { transform: T(x1, 1), opacity: 1, offset: 0.82 }, { transform: T(x1, 1.2), opacity: 0 }

  }
  async function playDemo() {

  }

        $('#winSub').textContent = TUTOR[idx].done;

            $('#btnNext').textContent = mode === 'daily' ? 'Back to menu' : 'Next level';

  function showLevels() {

    $('#how').hidden = false;
